# Run Python version checks and pytest with ghcr.io/bijumon/pypandoc_alpine_uv:latest.
name: Test Python project

on:
  push:
    branches: [main]
    paths:
      - "_src/**"
      - "compose.yaml"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "_src/**"
      - "compose.yaml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify Python version
        run: docker compose run --rm test python --version

      - name: Run tests
        run: docker compose run --rm test
