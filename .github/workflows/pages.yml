# Build and deploy the site with ghcr.io/bijumon/pypandoc_alpine_uv:latest.
name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # docbuild needs both its file index and previous outputs to build incrementally.
      # PR builds can restore the main-branch cache, but only trusted main runs save it.
      - name: Restore incremental build state
        id: docbuild-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache.db
            _site/
          key: docbuild-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            docbuild-${{ runner.os }}-

      - name: Build site
        run: docker compose run --rm build

      - name: Save incremental build state
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache.db
            _site/
          key: ${{ steps.docbuild-cache.outputs.cache-primary-key }}

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
