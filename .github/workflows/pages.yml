# Build and deploy the site with ghcr.io/bijumon/pypandoc_alpine_uv:latest.
name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # docbuild needs both its file index and previous outputs to build incrementally.
      # PR builds can restore the main-branch cache, but only trusted main runs save it.
      - name: Restore incremental build state
        id: docbuild-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache.db
            _site/
          key: docbuild-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            docbuild-${{ runner.os }}-

      # GitHub checkout gives unchanged files new filesystem timestamps. Compare the
      # restored cache's commit with this checkout so only unchanged paths are normalized.
      - name: Identify source changes since cached build
        id: docbuild-changes
        if: steps.docbuild-cache.outputs.cache-matched-key != ''
        env:
          CACHE_MATCHED_KEY: ${{ steps.docbuild-cache.outputs.cache-matched-key }}
        run: |
          set -eu
          prefix="docbuild-${RUNNER_OS}-"
          case "${CACHE_MATCHED_KEY}" in
            "${prefix}"*) cached_revision="${CACHE_MATCHED_KEY#"${prefix}"}" ;;
            *)
              echo "::warning::Unrecognized docbuild cache key; timestamp normalization skipped."
              echo "available=false" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac

          if ! printf '%s' "${cached_revision}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::No commit SHA found in the restored cache key; timestamp normalization skipped."
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "${cached_revision}"; then
            echo "::warning::Cached commit is unavailable; timestamp normalization skipped."
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --name-only --no-renames -z "${cached_revision}" "${GITHUB_SHA}" > .docbuild-changed-files
          git ls-files --others --exclude-standard -z >> .docbuild-changed-files
          echo "available=true" >> "${GITHUB_OUTPUT}"

      # Restore cached mtimes for unchanged files; invalidate changed paths so they rebuild.
      # This runs inside the build image because dbm.sqlite3 requires Python 3.13+.
      - name: Restore cached source timestamps
        if: steps.docbuild-changes.outputs.available == 'true'
        continue-on-error: true
        run: >-
          docker compose run --rm build python -m docbuild.timestamp_restore
          /work --changed-files /work/.docbuild-changed-files

      - name: Remove timestamp change list
        if: always()
        run: rm -f .docbuild-changed-files

      - name: Build site
        run: docker compose run --rm build

      - name: Save incremental build state
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache.db
            _site/
          key: ${{ steps.docbuild-cache.outputs.cache-primary-key }}

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
