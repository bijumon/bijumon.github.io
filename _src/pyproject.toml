[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docbuild"
version = "0.1.0"
description = "Build static sites from Markdown and Djot documents."
requires-python = ">=3.11"
dependencies = [
    "pypandoc",
    "python-frontmatter[toml]",
    "jinja2",
]

[project.scripts]
docbuild = "docbuild:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
