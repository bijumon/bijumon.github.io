[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docbuild"
version = "0.5.0"
description = "Build static sites from Markdown and Djot documents."
requires-python = ">=3.13"
dependencies = [
    "pypandoc",
    "python-frontmatter[toml]",
    "jinja2",
    "pytest",
]

[project.scripts]
docbuild = "docbuild.cli:main"
docbuild-serve = "docbuild.devserver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docbuild"]

[tool.pytest.ini_options]
testpaths = ["tests"]
