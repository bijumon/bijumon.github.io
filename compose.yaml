services:
  build:
    image: pypandoc_build:latest
    build:
      context: .
      dockerfile: Containerfile
    working_dir: /work
    volumes:
      - .:/work
    entrypoint: ["uv", "run", "--no-project", "--with-requirements", "/work/requirements.txt"]
    command: ["/work/docbuild.py"]

  serve:
    image: pypandoc_build:latest
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "${PORT:-8000}:8000"
    entrypoint: ["/bin/sh"]
    command: ["/work/serve.sh"]
