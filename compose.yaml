services:
  build:
    image: ghcr.io/bijumon/pypandoc_alpine_uv:latest
    working_dir: /work
    volumes:
      - .:/work
    entrypoint: ["uv", "run", "--project", "/work/_src"]
    command: ["docbuild", "/work"]

  test:
    image: ghcr.io/bijumon/pypandoc_alpine_uv:latest
    working_dir: /work/_src
    volumes:
      - .:/work
    entrypoint: ["uv", "run"]
    command: ["python", "-m", "pytest", "-rA"]

  serve:
    image: ghcr.io/bijumon/pypandoc_alpine_uv:latest
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "${PORT:-8000}:8000"
    entrypoint: ["/bin/sh"]
    command: ["/work/serve.sh"]
